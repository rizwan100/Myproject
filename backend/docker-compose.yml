version: "3.9"

services:
  backend:
    build: .
    container_name: matrimonial-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
    command: poetry run uvicorn app.main:app --host 0.0.0.0 --port 8080

  db:
    image: postgres:15
    container_name: matrimonial-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matrimonial
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
