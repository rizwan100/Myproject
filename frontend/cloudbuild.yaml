steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aasan-rishte-frontend', '.']
  
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aasan-rishte-frontend']
  
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'frontend'
    - '--image'
    - 'gcr.io/$PROJECT_ID/aasan-rishte-frontend'
    - '--region'
    - 'us-central1'
    - '--platform'
    - 'managed'
    - '--allow-unauthenticated'
    - '--set-env-vars=NEXT_PUBLIC_API_URL=https://aasan-rishte-backend-228802607375.asia-south1.run.app,NEXT_PUBLIC_APP_NAME=Aasan Rishte,NEXT_PUBLIC_SUPPORT_EMAIL=aasanrishtecontact@gmail.com,NEXT_PUBLIC_SUPPORT_PHONE=+917569319126,NEXT_PUBLIC_WHATSAPP_URL=https://wa.me/+917569319126'

images:
  - 'gcr.io/$PROJECT_ID/aasan-rishte-frontend'
